<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Browser Cache မသိမ်းဆည်းစေရန် ထည့်သွင်းထားသော Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>My Web Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #0d1117;
            color: #ffffff;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background-color: #0033a0;
            display: flex;
            flex-direction: column;
            padding-top: 15px;
            flex-shrink: 0;
            justify-content: space-between;
        }

        .sidebar-top {
            overflow-y: auto;
            flex-grow: 1;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px 20px 20px;
        }

        .brand-header img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            padding: 2px;
        }

        .brand-header span {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.2;
        }

        /* Menu Items */
        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .menu-item {
            position: relative;
        }

        .menu-link {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #e1e9ff;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
            cursor: pointer;
            word-break: break-word;
        }

        .menu-link:hover,
        .menu-link.active {
            background-color: #002277;
            color: #ffffff;
            font-weight: 600;
        }

        .menu-link svg {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Custom Dynamic Link Styling */
        .custom-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ff6b6b;
            font-size: 16px;
            cursor: pointer;
            padding: 0 10px;
            display: none;
        }

        .menu-item:hover .delete-btn {
            display: block;
        }

        /* Add Page Section */
        .add-page-box {
            padding: 15px;
            background-color: #002277;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .add-page-box h4 {
            font-size: 12px;
            text-transform: uppercase;
            color: #9bb5ff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .add-page-box input {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 8px;
            background: #0d1117;
            border: 1px solid #1f293d;
            border-radius: 4px;
            color: #ffffff;
            font-size: 12px;
            outline: none;
        }

        .add-page-box input:focus {
            border-color: #3b82f6;
        }

        .add-page-btn {
            width: 100%;
            padding: 8px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-page-btn:hover {
            background-color: #1d4ed8;
        }

        /* Main Display Area */
        .main-content {
            flex-grow: 1;
            height: 100vh;
            background: #0d1117;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="brand-header">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png?v=1.0.0" alt="Logo">
                <span>My Web<br>Dashboard</span>
            </div>

            <ul class="menu-list" id="menu-container">
                <!-- 1. Yellow Color Group -->
                <li class="menu-item">
                    <div class="menu-link active" onclick="loadFrame('https://kokhant300532-ship-it.github.io/KK/', this)">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                        credit percent noti
                    </div>
                </li>
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/Point-/', this)">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        Point-
                    </div>
                </li>

                <!-- 2. Orange Color Group -->
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/bankinfo-noti/', this)">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        bank info-noti %
                    </div>
                </li>
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/bank-wrong-/', this)">
                        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                        bank-wrong-
                    </div>
                </li>
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/Bank-error-noti---22/', this)">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        bank noti alert
                    </div>
                </li>

                <!-- 3. Green Color Group -->
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/split-noti/', this)">
                        <svg viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>
                        split-noti
                    </div>
                </li>
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/split-withdraw-instruction-/', this)">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                        split withdraw instruction
                    </div>
                </li>

                <!-- 4. White / Light Blue Group -->
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/tax-file/', this)">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        Tax file
                    </div>
                </li>

                <!-- 5. Pink Color Group (Crown Icons) -->
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/VIP/', this)">
                        <svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
                        VIP
                    </div>
                </li>
                <li class="menu-item">
                    <div class="menu-link" onclick="loadFrame('https://kokhant300532-ship-it.github.io/VIP-noti-card/', this)">
                        <svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
                        VIP noti card
                    </div>
                </li>
            </ul>
        </div>

        <div class="add-page-box">
            <h4>+ Add Custom Page</h4>
            <input type="text" id="page-title" placeholder="Page Title (e.g. My-Card)">
            <input type="url" id="page-url" placeholder="Page URL (https://...)">
            <button class="add-page-btn" onclick="addCustomPage()">Add Page</button>
        </div>
    </div>

    <div class="main-content">
        <iframe id="main-iframe" src=""></iframe>
    </div>

    <script>
        const iframe = document.getElementById('main-iframe');
        const menuContainer = document.getElementById('menu-container');

        // Dynamic Cache Busting Parameter ထုတ်ပေးသည့် Function
        function getCacheBuster() {
            return new Date().getTime();
        }

        // Cache မငြိဘဲ တိုက်ရိုက် အသစ်ပြောင်းစေရန် iFrame ခေါ်ယူသည့် Function
        function loadFrame(baseUrl, element) {
            // URL ထဲသို့ Dynamic Timestamp Parameter (_t=...) ထည့်ပေးခြင်း
            const separator = baseUrl.includes('?') ? '&' : '?';
            const cacheBustedUrl = `${baseUrl}${separator}_t=${getCacheBuster()}`;

            iframe.src = cacheBustedUrl;

            // Active State ချိန်ညှိခြင်း
            document.querySelectorAll('.menu-link').forEach(link => {
                link.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            }
        }

        // SessionStorage မှ Saved Pages များကို ပြန်ခေါ်ခြင်း
        function loadCustomPages() {
            const savedPages = JSON.parse(sessionStorage.getItem('dashboard_custom_pages')) || [];
            
            document.querySelectorAll('.custom-item').forEach(el => el.remove());

            savedPages.forEach((page, index) => {
                createPageMenuItem(page.title, page.url, index);
            });
        }

        // Custom Page အသစ်ထည့်ခြင်း
        function addCustomPage() {
            const titleInput = document.getElementById('page-title');
            const urlInput = document.getElementById('page-url');

            const title = titleInput.value.trim();
            const url = urlInput.value.trim();

            if (!title || !url) {
                alert('ကျေးဇူးပြု၍ Title နှင့် URL နှစ်ခုလုံးကို ဖြည့်စွက်ပါ။');
                return;
            }

            const savedPages = JSON.parse(sessionStorage.getItem('dashboard_custom_pages')) || [];
            savedPages.push({ title, url });
            sessionStorage.setItem('dashboard_custom_pages', JSON.stringify(savedPages));

            createPageMenuItem(title, url, savedPages.length - 1);

            titleInput.value = '';
            urlInput.value = '';
        }

        // Dynamic Menu Item ဖန်တီးခြင်း
        function createPageMenuItem(title, url, index) {
            const li = document.createElement('li');
            li.className = 'menu-item custom-item';
            li.innerHTML = `
                <div class="menu-link" onclick="loadFrame('${url}', this)" style="flex-grow: 1;">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    ${title}
                </div>
                <button class="delete-btn" onclick="removeCustomPage(${index})" title="Remove Page">×</button>
            `;
            menuContainer.appendChild(li);
        }

        // Custom Page ပြန်ဖျက်ခြင်း
        function removeCustomPage(index) {
            let savedPages = JSON.parse(sessionStorage.getItem('dashboard_custom_pages')) || [];
            savedPages.splice(index, 1);
            sessionStorage.setItem('dashboard_custom_pages', JSON.stringify(savedPages));
            loadCustomPages();
        }

        // Initial Page Load (အစတွင် Default Frame ကို Dynamic Timestamp ဖြင့် ခေါ်ယူခြင်း)
        loadFrame('https://kokhant300532-ship-it.github.io/KK/', document.querySelector('.menu-link.active'));
        loadCustomPages();
    </script>
</body>
</html>
