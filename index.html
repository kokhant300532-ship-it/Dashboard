<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #0d1117;
            color: #ffffff;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background-color: #0033a0; /* Mercado Libre Blue */
            display: flex;
            flex-direction: column;
            padding-top: 15px;
            flex-shrink: 0;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px 25px 20px;
        }

        .brand-header img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            padding: 2px;
        }

        .brand-header span {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.2;
        }

        /* Menu Items */
        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .menu-item a {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            color: #e1e9ff;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }

        .menu-item a:hover,
        .menu-item a.active {
            background-color: #002277;
            color: #ffffff;
            font-weight: 600;
        }

        .menu-item svg {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            fill: currentColor;
        }

        /* Main Display Area */
        .main-content {
            flex-grow: 1;
            height: 100vh;
            background: #0d1117;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <iframe name="content-frame" src="https://kokhant300532-ship-it.github.io/KK/"></iframe>
    </div>

    <script>
        // Menu item Active state handling
        const menuLinks = document.querySelectorAll('.menu-item a');
        menuLinks.forEach(link => {
            link.addEventListener('click', function() {
                menuLinks.forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
